{{- $namespace := .Values.kubernetes.namespace -}}
{{- $prefix := .Values.application.name }}
{{- range $sqlInstances := .Values.cloudsql }}
{{- $secretName := printf "%s-%s-root-password" $prefix $sqlInstances.name  }}
{{- $existingSecret := lookup "v1" "Secret" $namespace $secretName }}
{{- if $existingSecret }}
{{- /* Secret exists, preserve existing password */}}
{{- $password := index $existingSecret.data "password" | b64dec }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  password: {{ $password }}
{{- else }}
{{- /* Secret doesn't exist, generate new non-deterministic password */}}
{{- $randomPassword := randAlphaNum 32 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  password: {{ $randomPassword }}
{{- end }}
{{- end }}
