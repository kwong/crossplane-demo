{{- $namespace := .Values.kubernetes.namespace -}}
{{- $prefix := .Values.application.name }}
{{- range $sqlInstances := .Values.cloudsql }}
{{- range $user := $sqlInstances.users }}
{{- $secretName := printf "%s-%s-%s-password" $prefix $sqlInstances.name $user.name }}
{{- $existingSecret := lookup "v1" "Secret" $namespace $secretName }}
{{- if $existingSecret }}
{{- /* Secret exists, preserve existing password */}}
{{- $password := index $existingSecret.data "password" | b64dec }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $prefix }}-{{ $sqlInstances.name }}-{{ $user.name }}-password
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ $password | b64enc }}
{{- else }}
{{- /* Secret doesn't exist, generate new non-deterministic password */}}
{{- $randomPassword := randAlphaNum 32 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $prefix }}-{{ $sqlInstances.name }}-{{ $user.name }}-password
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ $randomPassword | b64enc }}
{{- end }}
{{- end }}
{{- end }}
