kubernetes:
  namespace: default

gcp:
  project_id: cc-sa-sandbox-20200619
  region: asia-southeast1

  gsm_project_id: cc-sa-sandbox-20200619

  sql:
    - name: cloudsql-1
      region: asia-southeast1
      database_version: POSTGRES_17
      edition: ENTERPRISE
      tier: db-custom-2-8192
      disk_size: 20
      availabilityType: ZONAL
      diskAutoresize: true
      ipConfiguration:
        privateNetwork: projects/cc-sa-sandbox-20200619/global/networks/default
        ipv4Enabled: false
      databaseFlags:
        - name: cloudsql.iam_authentication
          value: "on"
        - name: timezone
          value: "UTC+7"
      users:
        - name: dbuser
          password: placeholder1
        - name: dbuser2
          password: placeholder2
      
