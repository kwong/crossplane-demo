kubernetes:
  namespace: default


application:
  group: test
  runtime: golang
  name: test-app-v2

gcp:
  projectId: cc-sa-sandbox-20200619
  region: asia-southeast1

cloudsql:
  - name: cloudsql-1
    region: asia-southeast1
    databaseVersion: POSTGRES_17
    edition: ENTERPRISE
    tier: db-custom-2-8192
    diskSize: 20
    availabilityType: ZONAL
    diskAutoresize: true
    ipConfiguration:
      privateNetwork: projects/cc-sa-sandbox-20200619/global/networks/default
      ipv4Enabled: true
    databases:
      - name: test-db
        charset: UTF8
    databaseFlags:
      - name: cloudsql.iam_authentication
        value: "on"
      - name: timezone
        value: "UTC+7"
    users:
      - name: dbuser
      - name: dbuser2
